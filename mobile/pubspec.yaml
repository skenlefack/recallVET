name: recallvet_mobile
description: "RecallVET - Application mobile de gestion vétérinaire"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.4.0
  dio: ^5.8.0

  # State management
  provider: ^6.1.0

  # Storage
  shared_preferences: ^2.5.0
  sqflite: ^2.4.0
  path: ^1.9.0

  # Navigation
  go_router: ^14.8.0

  # UI
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Native features
  camera: ^0.11.0
  image_picker: ^1.1.0
  geolocator: ^13.0.0
  local_auth: ^2.3.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0077B6"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
